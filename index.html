<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>Qrator Labs × FT Community — Security Zone</title>
<style>html,body{margin:0;min-height:100%;background:#030912;color:#f5f7fb;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}body{display:grid;place-items:center}.loader{width:min(520px,calc(100% - 40px));padding:40px;border:1px solid #20344a;border-radius:24px;background:#071321}.bar{height:3px;margin-top:22px;overflow:hidden;border-radius:99px;background:#17283a}.bar:after{display:block;width:45%;height:100%;background:linear-gradient(90deg,#a32de5,#2c67ff);content:"";animation:m 1.1s ease-in-out infinite alternate}@keyframes m{to{transform:translateX(125%)}}small{color:#91a4b6}</style>
</head>
<body><div class="loader"><strong>FT COMMUNITY × QRATOR LABS</strong><p>Загружаем Security Zone preview…</p><small>Интерактивный каталог и корзина</small><div class="bar"></div></div>
<script>
(async()=>{try{const names=Array.from({length:12},(_,i)=>`parts/p${String(i).padStart(2,'0')}.txt`);const parts=[];for(const name of names){const r=await fetch(name,{cache:'no-store'});if(!r.ok)throw new Error(name);parts.push(await r.text())}document.open();document.write(parts.join(''));document.close()}catch(e){document.body.innerHTML='<div class="loader"><strong>Сайт обновляется</strong><p>Не удалось загрузить один из файлов preview. Обновите страницу через минуту.</p></div>';console.error(e)}})();
</script></body></html>
