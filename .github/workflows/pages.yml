name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch approved copy
        run: python scripts/patch_site.py
      - name: Build clean hero image
        run: |
          base64 -d site/assets/qrator-ft-hero-clean.webp.b64 > site/assets/qrator-ft-hero-clean.webp
          rm site/assets/qrator-ft-hero-clean.webp.b64
      - name: Patch clean hero without price overlay
        run: python scripts/patch_hero_v2.py
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
